<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="card-header">
      <h2>Quên mật khẩu?</h2>
      <p>Nhập email của bạn để nhận mã OTP đặt lại mật khẩu</p>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Nhập email của bạn"
          [class.error]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.dirty"
        />
        <div class="error-message" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.dirty">
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['required']">Email là bắt buộc</span>
          <span *ngIf="forgotPasswordForm.get('email')?.errors?.['email']">Email không hợp lệ</span>
        </div>
      </div>

      <button type="submit" [disabled]="loading" class="submit-btn">
        <span *ngIf="!loading">Gửi OTP</span>
        <span *ngIf="loading">Đang gửi...</span>
      </button>
    </form>

    <div class="back-link">
      <a (click)="backToLogin()">Quay lại đăng nhập</a>
    </div>

    <div class="success-message" *ngIf="success">
      <p>OTP đã được gửi đến email của bạn!</p>
    </div>
  </div>
</div>
