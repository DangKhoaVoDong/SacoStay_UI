<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="card-header">
      <h2>Đặt lại mật khẩu</h2>
      <p>Nhập mật khẩu mới cho tài khoản của bạn</p>
    </div>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="newPassword">Mật khẩu mới</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)"
          [class.error]="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.dirty"
        />
        <div class="error-message" *ngIf="resetPasswordForm.get('newPassword')?.invalid && resetPasswordForm.get('newPassword')?.dirty">
          <span *ngIf="resetPasswordForm.get('newPassword')?.errors?.['required']">Mật khẩu mới là bắt buộc</span>
          <span *ngIf="resetPasswordForm.get('newPassword')?.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Xác nhận mật khẩu</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Nhập lại mật khẩu mới"
          [class.error]="(resetPasswordForm.get('confirmPassword')?.invalid || resetPasswordForm.errors?.['passwordMismatch']) && resetPasswordForm.get('confirmPassword')?.dirty"
        />
        <div class="error-message" *ngIf="resetPasswordForm.get('confirmPassword')?.dirty">
          <span *ngIf="resetPasswordForm.get('confirmPassword')?.errors?.['required']">Xác nhận mật khẩu là bắt buộc</span>
          <span *ngIf="resetPasswordForm.errors?.['passwordMismatch']">Mật khẩu không khớp</span>
        </div>
      </div>

      <button type="submit" [disabled]="loading" class="submit-btn">
        <span *ngIf="!loading">Đặt lại mật khẩu</span>
        <span *ngIf="loading">Đang xử lý...</span>
      </button>
    </form>

    <div class="back-link">
      <a (click)="backToLogin()">Quay lại đăng nhập</a>
    </div>
  </div>
</div>
