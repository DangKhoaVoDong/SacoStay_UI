<div class="otp-page">
  <nav class="bg-white/90 backdrop-blur-md border-b border-orange-100/80 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto safe-px sm:px-6 lg:px-8">
      <div class="flex justify-between h-16 items-center">
        <a routerLink="/" class="text-xl font-bold text-saco-orange tracking-tight">SacoStay</a>
        <div class="flex items-center gap-3">
          <a routerLink="/login" class="text-gray-600 hover:text-saco-orange px-3 py-2 rounded-xl text-sm font-semibold transition-colors">
            Đăng nhập
          </a>
          <a routerLink="/register" class="saco-btn saco-btn-primary !py-2 !px-4 !text-sm">
            Đăng ký
          </a>
        </div>
      </div>
    </div>
  </nav>

  <main class="otp-page__main">
    <div class="otp-card">
      <div class="otp-card__icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>

      <h1 class="otp-card__title">Xác thực Email</h1>
      <p class="otp-card__desc">
        Chúng tôi đã gửi mã xác thực gồm 6 chữ số đến email
        <span class="otp-card__email">{{ email }}</span>
      </p>

      <app-otp-digit-input
        [(ngModel)]="otpValue"
        [disabled]="isLoading"
        ariaLabel="Mã xác thực email 6 chữ số"
      />

      <button
        type="button"
        class="saco-btn saco-btn-primary w-full"
        (click)="handleVerify()"
        [disabled]="!isOtpComplete || isLoading"
      >
        @if (!isLoading) {
          Xác thực
        } @else {
          <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        }
      </button>

      <p class="otp-card__footer">
        Chưa nhận được mã?
        @if (countdown > 0) {
          <span class="font-medium text-gray-800"> Gửi lại sau {{ countdown }}s</span>
        } @else {
          <button type="button" class="otp-card__resend" (click)="handleResend()">Gửi lại mã</button>
        }
      </p>
    </div>
  </main>
</div>
