<div class="otp-page">
  <main class="otp-page__main">
    <div class="otp-card">
      <div class="otp-card__icon">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
        </svg>
      </div>

      <h1 class="otp-card__title">Xác thực Email</h1>
      <p class="otp-card__desc">
        Chúng tôi đã gửi mã xác thực gồm 6 chữ số đến email
        <span class="otp-card__email">{{ email }}</span>
      </p>

      <form [formGroup]="otpForm" (ngSubmit)="submit()">
        <app-otp-digit-input formControlName="otp" [disabled]="loading" ariaLabel="Mã OTP đặt lại mật khẩu" />

        <button type="submit" class="saco-btn saco-btn-primary w-full" [disabled]="loading || otpForm.invalid">
          @if (!loading) {
            Xác thực
          } @else {
            Đang xác thực...
          }
        </button>
      </form>

      <p class="otp-card__footer">
        Chưa nhận được mã?
        @if (countdown > 0) {
          <span class="font-medium text-gray-800"> Gửi lại sau {{ countdown }}s</span>
        } @else {
          <button type="button" class="otp-card__resend" [disabled]="loading" (click)="resendOtp()">Gửi lại mã</button>
        }
      </p>

      <button type="button" class="otp-card__back" (click)="backToForgot()">Quay lại</button>
    </div>
  </main>
</div>
