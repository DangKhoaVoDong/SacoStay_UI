<div class="relative" (click)="$event.stopPropagation()">
  <button
    type="button"
    class="relative inline-flex items-center justify-center w-10 h-10 rounded-xl transition-colors"
    [class.text-gray-600]="variant === 'light'"
    [class.hover:bg-orange-50]="variant === 'light'"
    [class.hover:text-[#FF9F43]]="variant === 'light'"
    [class.text-gray-300]="variant === 'dark'"
    [class.hover:bg-white/10]="variant === 'dark'"
    [class.hover:text-white]="variant === 'dark'"
    aria-label="Thông báo"
    (click)="toggle(); $event.stopPropagation()"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
      />
    </svg>
    @if (unread() > 0) {
      <span
        class="absolute top-0.5 right-0.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold leading-none flex items-center justify-center ring-2 z-20"
        [class.ring-white]="variant === 'light'"
        [class.ring-[#1A1A2E]]="variant === 'dark'"
      >
        {{ unread() > 99 ? '99+' : unread() }}
      </span>
    }
  </button>

  @if (open()) {
    <div
      class="absolute max-h-[min(420px,70vh)] overflow-hidden rounded-2xl bg-white shadow-2xl border border-orange-100 z-[100] flex flex-col"
      [class.right-0]="panelPlacement === 'below'"
      [class.top-full]="panelPlacement === 'below'"
      [class.mt-2]="panelPlacement === 'below'"
      [class.w-[min(360px,calc(100vw-2rem))]]="panelPlacement === 'below'"
      [class.left-full]="panelPlacement === 'beside-right'"
      [class.top-0]="panelPlacement === 'beside-right'"
      [class.ml-2]="panelPlacement === 'beside-right'"
      [class.w-80]="panelPlacement === 'beside-right'"
    >
      <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 shrink-0">
        <h3 class="font-bold text-gray-900 text-sm">Thông báo</h3>
        @if (unread() > 0) {
          <button
            type="button"
            class="text-xs font-medium text-[#FF9F43] hover:underline"
            (click)="markAllRead($event)"
          >
            Đánh dấu đã đọc
          </button>
        }
      </div>

      <div class="overflow-y-auto flex-1">
        @if (loading()) {
          <p class="text-center text-sm text-gray-500 py-8">Đang tải…</p>
        } @else if (!items().length) {
          <p class="text-center text-sm text-gray-500 py-8">Chưa có thông báo.</p>
        } @else {
          <ul class="divide-y divide-gray-50">
            @for (n of items(); track n.id) {
              <li>
                <button
                  type="button"
                  class="w-full text-left px-4 py-3 hover:bg-orange-50/60 transition-colors"
                  [class.bg-orange-50/40]="!n.isRead"
                  (click)="onItemClick(n, $event)"
                >
                  <div class="flex items-start gap-2">
                    @if (!n.isRead) {
                      <span class="w-2 h-2 rounded-full bg-[#FF9F43] shrink-0 mt-1.5"></span>
                    } @else {
                      <span class="w-2 shrink-0"></span>
                    }
                    <div class="min-w-0 flex-1">
                      <p class="text-sm font-semibold text-gray-900 truncate">{{ n.title }}</p>
                      <p class="text-xs text-gray-600 mt-0.5 line-clamp-3 whitespace-pre-line">{{ notificationBody(n) }}</p>
                      <p class="text-[10px] text-gray-400 mt-1">{{ formatTime(n.createdAt) }}</p>
                    </div>
                  </div>
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  }
</div>
