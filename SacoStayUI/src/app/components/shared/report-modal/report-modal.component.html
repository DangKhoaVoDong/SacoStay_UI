@if (isOpen) {
  <div class="fixed inset-0 z-[100] flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/50" (click)="close()"></div>
    <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6 z-10">
      <h2 class="text-lg font-bold text-gray-900 mb-2">Báo cáo {{ type === 'room' ? 'tin đăng' : 'người dùng' }}</h2>
      @if (targetName) {
        <p class="text-sm text-gray-500 mb-4 truncate">{{ targetName }}</p>
      }
      @if (!submitted) {
        <label class="block text-sm font-medium text-gray-700 mb-2">Lý do báo cáo</label>
        <textarea
          [(ngModel)]="reason"
          rows="4"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#FF9F43] focus:border-[#FF9F43] outline-none"
          placeholder="Mô tả vấn đề..."
        ></textarea>
        <div class="flex justify-end gap-3 mt-6">
          <button type="button" (click)="close()" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-900">
            Hủy
          </button>
          <button
            type="button"
            (click)="submit()"
            [disabled]="!reason.trim()"
            class="px-4 py-2 text-sm font-medium rounded-lg bg-[#EF4444] text-white hover:bg-[#DC2626] disabled:opacity-50"
          >
            Gửi báo cáo
          </button>
        </div>
      } @else {
        <p class="text-sm text-gray-600 mb-6">
          Cảm ơn bạn đã gửi báo cáo. Đội ngũ SacoStay sẽ xem xét trong thời gian sớm nhất.
        </p>
        <button
          type="button"
          (click)="close()"
          class="w-full px-4 py-2 text-sm font-medium rounded-lg bg-[#FF9F43] text-white hover:bg-[#FF8C2A]"
        >
          Đóng
        </button>
      }
    </div>
  </div>
}
