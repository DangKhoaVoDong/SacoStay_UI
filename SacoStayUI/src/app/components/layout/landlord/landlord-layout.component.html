<div class="min-h-screen bg-gray-50 flex">
  <div class="hidden md:block w-64 flex-shrink-0 overflow-visible relative z-40">
    <app-landlord-sidebar />
  </div>

  @if (mobileMenuOpen) {
    <div class="md:hidden fixed inset-0 z-50 flex">
      <div class="fixed inset-0 bg-black/50" (click)="closeMobileMenu()"></div>
      <div class="relative w-64 max-w-sm flex-1">
        <app-landlord-sidebar />
        <button
          type="button"
          (click)="closeMobileMenu()"
          class="absolute top-4 -right-12 w-10 h-10 bg-white rounded-full flex items-center justify-center text-gray-900 shadow-lg"
          aria-label="Đóng menu"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  }

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <div class="md:hidden bg-[#1A1A2E] text-white h-16 flex items-center px-4 justify-between sticky top-0 z-30">
      <div class="flex items-center">
        <img [src]="logoUrl" alt="SacoStay" [class]="logoClass + ' !h-[3.25rem]'" />
        <span class="ml-2 text-xs font-bold bg-white/10 px-2 py-1 rounded text-gray-300">PRO</span>
      </div>
      <div class="flex items-center gap-1">
        <app-notification-bell variant="dark" [isLandlord]="true" panelPlacement="beside-right" />
        <button type="button" (click)="openMobileMenu()" class="p-2" aria-label="Mở menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        </button>
      </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 lg:p-8">
      <div class="max-w-5xl mx-auto w-full">
        <ng-content />
      </div>
    </main>
  </div>
</div>
