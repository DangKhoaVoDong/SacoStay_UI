<nav class="bg-white/80 backdrop-blur-md border-b border-orange-100 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16 items-center">
            <div class="flex items-center gap-6">
                <a routerLink="/" class="flex items-center gap-3">
                    <img src="https://cdn.magicpatterns.com/uploads/rwG78VB7w9oqMtogK5vpyZ/Screenshot_2026-03-15_223642.png"
                        alt="SacoStay" class="h-12 w-auto drop-shadow-[0_2px_6px_rgba(255,140,0,0.25)]" />
                </a>
                <div class="hidden sm:flex sm:space-x-2">
                    <a *ngFor="let link of visibleNavLinks" [routerLink]="link.href"
                        class="text-sm font-semibold text-gray-600 hover:text-[#FF9F43] px-3 py-2 rounded-xl transition-colors"
                        [ngClass]="isActive(link.href) ? 'text-[#1A1A2E] border-b-2 border-[#FF9F43]' : 'border-transparent'">
                        <span class="inline-flex items-center gap-2">
                            <svg *ngIf="link.icon === 'search'" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
                            </svg>
                            <svg *ngIf="link.icon === 'home'" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M3 9.75L12 4l9 5.75v9.5a1 1 0 01-1 1H4a1 1 0 01-1-1v-9.5z" />
                            </svg>
                            <svg *ngIf="link.icon === 'map'" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 16.382V5.618a1 1 0 00-1.447-.894L15 7m0 13V7m0 0L9 4" />
                            </svg>
                            <svg *ngIf="link.icon === 'message'" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                            </svg>
                            <svg *ngIf="link.icon === 'shield'" class="w-4 h-4" fill="none" stroke="currentColor"
                                viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M12 11c0-1.105.895-2 2-2h4a2 2 0 012 2v6a2 2 0 01-2 2h-4a2 2 0 01-2-2v-6zM6 8h3a2 2 0 012 2v9H6a2 2 0 01-2-2V10a2 2 0 012-2z" />
                            </svg>
                            {{ link.name }}
                        </span>
                    </a>
                </div>
            </div>

            <div class="hidden sm:flex sm:items-center sm:space-x-4">
                <a *ngIf="isLoggedIn && userRole === 'landlord'" routerLink="/landlord-profile"
                    class="bg-[#FF9F43] text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-[#FF8C2A] transition-colors">
                    Kênh Chủ trọ
                </a>

                <ng-container *ngIf="isLoggedIn; else guestLinks">
                    <div class="flex items-center space-x-4">
                        <a [routerLink]="profileLink" [queryParams]="profileLinkQueryParams"
                            class="flex items-center gap-2 text-sm font-medium text-[#1A1A2E] hover:text-[#FF9F43] transition-colors">
                            <img [src]="avatarUrl" alt=""
                                class="h-9 w-9 rounded-full object-cover border-2 border-orange-100" />
                            <span>{{ profileLabel }}</span>
                        </a>
                        <button type="button" (click)="logout()" aria-label="Đăng xuất"
                            class="inline-flex items-center justify-center p-2 rounded-lg border border-gray-200 text-gray-600 hover:text-[#FF9F43] hover:border-[#FF9F43] transition-colors">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
                            </svg>
                        </button>
                    </div>
                </ng-container>

                <ng-template #guestLinks>
                    <div class="flex items-center space-x-3">
                        <a routerLink="/login"
                            class="text-sm font-medium text-[#1A1A2E] hover:text-[#FF9F43] transition-colors">Đăng
                            nhập</a>
                        <a routerLink="/register"
                            class="bg-[#FF9F43] text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-[#FF8C2A] transition-colors">
                            Đăng ký
                        </a>
                    </div>
                </ng-template>
            </div>

            <div class="-mr-2 flex items-center sm:hidden">
                <button type="button" (click)="toggleMenu()"
                    class="inline-flex items-center justify-center p-2 rounded-xl text-gray-400 hover:text-[#FF9F43] hover:bg-[#FFF8F0] focus:outline-none focus:ring-2 focus:ring-inset focus:ring-[#FF9F43]">
                    <span class="sr-only">Open main menu</span>
                    <svg *ngIf="!isOpen" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg *ngIf="isOpen" class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div *ngIf="isOpen" class="sm:hidden bg-white border-t border-orange-100">
        <div class="pt-2 pb-3 space-y-1 px-2">
            <a *ngFor="let link of visibleNavLinks" [routerLink]="link.href" (click)="toggleMenu()"
                class="block rounded-xl px-3 py-3 text-base font-medium text-[#6B7280] hover:bg-[#FFF8F0] hover:text-[#FF9F43]"
                [ngClass]="isActive(link.href) ? 'bg-[#FFF8F0] text-[#FF9F43]' : ''">
                <span class="inline-flex items-center gap-2">
                    <svg *ngIf="link.icon === 'search'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-4.35-4.35M10.5 18a7.5 7.5 0 100-15 7.5 7.5 0 000 15z" />
                    </svg>
                    <svg *ngIf="link.icon === 'home'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 9.75L12 4l9 5.75v9.5a1 1 0 01-1 1H4a1 1 0 01-1-1v-9.5z" />
                    </svg>
                    <svg *ngIf="link.icon === 'map'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 16.382V5.618a1 1 0 00-1.447-.894L15 7m0 13V7m0 0L9 4" />
                    </svg>
                    <svg *ngIf="link.icon === 'message'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                    </svg>
                    <svg *ngIf="link.icon === 'shield'" class="w-5 h-5" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 11c0-1.105.895-2 2-2h4a2 2 0 012 2v6a2 2 0 01-2 2h-4a2 2 0 01-2-2v-6zM6 8h3a2 2 0 012 2v9H6a2 2 0 01-2-2V10a2 2 0 012-2z" />
                    </svg>
                    {{ link.name }}
                </span>
            </a>

            <a *ngIf="isLoggedIn && userRole === 'landlord'" routerLink="/landlord-profile" (click)="toggleMenu()"
                class="block rounded-xl px-3 py-3 text-base font-medium text-[#FF9F43] hover:bg-[#FFF8F0]">
                Kênh Chủ trọ
            </a>
        </div>

        <div class="pt-4 pb-4 border-t border-orange-100 px-4">
            <ng-container *ngIf="isLoggedIn; else mobileGuestLinks">
                <div class="flex items-center gap-3">
                <a [routerLink]="profileLink" [queryParams]="profileLinkQueryParams" (click)="toggleMenu()" class="flex items-center gap-3 flex-1 min-w-0">
                    <img [src]="avatarUrl" alt=""
                        class="h-10 w-10 rounded-full object-cover border-2 border-orange-100" />
                    <div class="min-w-0">
                        <div class="text-base font-medium text-[#1A1A2E] truncate">{{ profileLabel }}</div>
                        <div class="text-sm text-[#6B7280] truncate">{{ user?.email }}</div>
                    </div>
                </a>
                    <button type="button" (click)="logout()"
                        class="shrink-0 inline-flex h-10 w-10 items-center justify-center rounded-full bg-[#FFF8F0] text-[#6B7280] hover:text-[#FF9F43] transition-colors">
                        <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v1" />
                        </svg>
                    </button>
                </div>
            </ng-container>
            <ng-template #mobileGuestLinks>
                <div class="space-y-3">
                    <a routerLink="/login" (click)="toggleMenu()"
                        class="block w-full rounded-xl border border-orange-100 bg-white px-4 py-3 text-center text-sm font-medium text-[#1A1A2E] hover:bg-[#FFF8F0] hover:text-[#FF9F43]">
                        Đăng nhập
                    </a>
                    <a routerLink="/register" (click)="toggleMenu()"
                        class="block w-full rounded-xl bg-[#FF9F43] px-4 py-3 text-center text-sm font-medium text-white hover:bg-[#FF8C2A]">
                        Đăng ký ngay
                    </a>
                </div>
            </ng-template>
        </div>
    </div>
</nav>
