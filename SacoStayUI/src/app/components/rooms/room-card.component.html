<a [routerLink]="['/rooms', room.id]" [queryParams]="detailQueryParams" class="block group h-full">
  <article [class]="articleClass + ' h-full flex flex-col'">
    <div class="relative aspect-[4/3] bg-gray-100 shrink-0 overflow-hidden">
      @if (room.imageUrl) {
        <img
          [src]="room.imageUrl"
          [alt]="room.title"
          class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300"
        />
      } @else {
        <div class="w-full h-full flex items-center justify-center text-gray-400 text-sm">Chưa có ảnh</div>
      }
      <span [class]="priceBadgeClass">{{ formatPrice(room.price) }}</span>
    </div>
    <div class="p-4 flex-1 flex flex-col">
      <h2 [class]="titleClass">{{ room.title }}</h2>
      <p class="text-sm text-gray-500 flex items-start gap-1 mt-2 flex-1">
        <svg class="w-4 h-4 shrink-0 mt-0.5 text-[#ffbd59]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="line-clamp-2">{{ displayAddress }}</span>
      </p>
    </div>
  </article>
</a>
