<a [routerLink]="['/rooms', room.id]" class="block group">
  <article
    class="bg-white rounded-2xl overflow-hidden shadow-sm border border-orange-50 hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300"
  >
    <div class="relative aspect-[4/3] bg-gray-100">
      @if (room.imageUrl) {
        <img
          [src]="room.imageUrl"
          [alt]="room.title"
          class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
        />
      } @else {
        <div class="w-full h-full flex items-center justify-center text-gray-400 text-sm">Chưa có ảnh</div>
      }
      <span
        class="absolute bottom-3 left-3 bg-[#FF9F43] text-white text-sm font-bold px-3 py-1 rounded-lg shadow"
      >
        {{ formatPrice(room.price) }}
      </span>
    </div>
    <div class="p-4">
      <h2 [class]="titleClass">{{ room.title }}</h2>
      <p class="text-sm text-gray-500 flex items-start gap-1 mt-2 mb-3">
        <svg class="w-4 h-4 shrink-0 mt-0.5 text-[#FF6B6B]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
        </svg>
        <span class="line-clamp-2">{{ displayAddress }}</span>
      </p>
      <div class="flex items-center gap-4 text-sm text-gray-600">
        @if (room.area) {
          <span class="inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
            </svg>
            {{ room.area }}m²
          </span>
        }
        @if (peopleLabel) {
          <span class="inline-flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
            </svg>
            {{ peopleLabel }}
          </span>
        }
      </div>
    </div>
  </article>
</a>
